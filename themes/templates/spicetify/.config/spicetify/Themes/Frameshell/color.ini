sidebar            = {{colors.bg|bare}}
player             = {{colors.bg|bare}}
card               = {{colors.bg|bare}}
shadow             = {{colors.bg|darken:50|bare}}
selected-row       = {{colors.text|bare}}
button             = {{colors.primary|bare}}
button-active      = {{colors.secondary|bare}}
button-disabled    = {{colors.frame|bare}}
tab-active         = {{colors.surface2|bare}}
notification       = {{colors.primary|bare}}
notification-error = {{colors.danger|bare}}
misc               = {{colors.frame|bare}}
