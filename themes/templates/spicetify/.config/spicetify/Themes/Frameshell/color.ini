; {{name}} – generated by `frame theme`; edit themes/templates/spicetify/… instead
; Enable: spicetify config current_theme Frameshell color_scheme Frameshell && spicetify apply
; TUI style: panels share the background and are separated by borders only.

[Frameshell]
